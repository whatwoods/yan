<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .42  0 0 0 0 .3  0 0 0 .12 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="paper-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf5ea"/>
      <stop offset="100%" stop-color="#ebe1d0"/>
    </linearGradient>
  </defs>
  <!-- Paper background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#paper-grad)"/>
  <rect width="512" height="512" rx="96" ry="96" filter="url(#paper)" opacity=".4"/>
  <!-- Seal stamp -->
  <g transform="translate(256 256) rotate(-6)">
    <rect x="-128" y="-128" width="256" height="256" rx="22" fill="#b8443a"/>
    <rect x="-128" y="-128" width="256" height="256" rx="22" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="8"/>
    <text x="0" y="0"
          font-family="'Source Han Serif SC','Noto Serif SC',Songti SC,serif"
          font-size="200" font-weight="700"
          fill="#fff"
          text-anchor="middle" dominant-baseline="central"
          letter-spacing="4">砚</text>
  </g>
</svg>
